<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=chevron_left" />
    <title>Documents</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-image: url(Docs.png);
            background-repeat: no-repeat;
            background-position: center;
            background-size: cover;
            background-attachment: fixed;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .search-bar {
            margin: 20px 0;
            padding: 10px;
            width: 100%;
            max-width: 500px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }
        .documents-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }
        .document-card {
            background: white;
            padding: 15px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .document-card h3 {
            margin: 0 0 10px;
            font-size: 18px;
        }
        .document-card p {
            margin: 5px 0;
            color: #666;
        }
        .category-title {
            color: #ffffff;
            margin-bottom: 20px;
        }
        .message {
            margin: 20px 0;
            padding: 10px;
            border-radius: 4px;
            color: white;
        }
        .message.error {
            background-color: #f44336;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 id="category-title" class="category-title">Documents</h1>
        <input 
            type="text" 
            id="search-bar" 
            class="search-bar" 
            placeholder="Search documents..." 
            oninput="filterDocuments()"
        >
        <div id="message" class="message" style="display: none;"></div>
        <div id="documents-list" class="documents-list"></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            console.log('DocList.html loaded');
            const categoryTitle = document.getElementById('category-title');
            const documentsList = document.getElementById('documents-list');
            const messageDiv = document.getElementById('message');

            // Get categoryId from URL
            const params = new URLSearchParams(window.location.search);
            const categoryId = params.get('categoryId');

            try {
                // Fetch category name
                let categoryName = 'Documents';
                if (categoryId) {
                    const categoryResponse = await fetch(`http://localhost:5000/api/categories/${categoryId}`, {
                        credentials: 'include',
                    });
                    const categoryData = await categoryResponse.json();
                    console.log('Fetch Category response:', categoryData);
                    if (categoryResponse.ok) {
                        categoryName = categoryData.data.name;
                    }
                }
                categoryTitle.textContent = categoryName;

                // Fetch resources
                const url = categoryId 
                    ? `http://localhost:5000/api/resources?category=${categoryId}`
                    : 'http://localhost:5000/api/resources';
                const response = await fetch(url, {
                    credentials: 'include',
                });
                const data = await response.json();
                console.log('Fetch Resources response:', data);

                if (response.ok) {
                    if (data.data.length === 0) {
                        messageDiv.textContent = 'No resources found';
                        messageDiv.classList.add('error');
                        messageDiv.style.display = 'block';
                    } else {
                        renderDocuments(data.data);
                    }
                } else {
                    messageDiv.textContent = data.error || 'Failed to load resources';
                    messageDiv.classList.add('error');
                    messageDiv.style.display = 'block';
                }
            } catch (err) {
                console.error('Fetch Resources Error:', err);
                messageDiv.textContent = 'Error: ' + err.message;
                messageDiv.classList.add('error');
                messageDiv.style.display = 'block';
            }
        });

        function renderDocuments(resources) {
            const documentsList = document.getElementById('documents-list');
            documentsList.innerHTML = resources.map(resource => `
                <div class="document-card">
                    <h3>${resource.title}</h3>
                    <p>Code: ${resource.description}</p>
                    <p>Category: ${resource.category?.name || 'N/A'}</p>
                    <p>Uploaded by: ${resource.uploadedBy?.name || 'Unknown'}</p>
                    <a href="http://localhost:5000/api/resources/${resource._id}/download">Download</a>
                </div>
            `).join('');
        }

        function filterDocuments() {
            const query = document.getElementById('search-bar').value.toLowerCase();
            const cards = document.querySelectorAll('.document-card');
            cards.forEach(card => {
                const title = card.querySelector('h3').textContent.toLowerCase();
                const code = card.querySelector('p:nth-child(2)').textContent.toLowerCase();
                card.style.display = (title.includes(query) || code.includes(query)) ? 'block' : 'none';
            });
        }
    </script>
</body>
</html>
